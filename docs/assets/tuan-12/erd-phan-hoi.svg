<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1632"
  height="1716"
  viewBox="0 0 1632 1716"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">ERD tổng quan: Phản hồi liên tục</title>
  <desc id="description">
    10 model chính và 4 model ngữ cảnh. Thẻ liệt kê khóa chính, khóa duy nhất và
    khóa ngoại từ DMMF. SVG được sinh trực tiếp, không render Mermaid. Tuần 12:
    47 model thiết kế, 45 runtime, 2 model chỉ thiết kế. Cờ bất thường và lịch
    sử xem xét đã có runtime; không còn model chỉ seed. Chi tiết toàn bộ scalar
    nằm trong ERD.md.
  </desc>
  <style>
    text {
      font-family: "Segoe UI", Arial, sans-serif;
      fill: #0f172a;
    }
    .heading {
      font-size: 29px;
      font-weight: 700;
    }
    .sub {
      font-size: 17px;
      fill: #475569;
    }
    .model {
      font-size: 22px;
      font-weight: 700;
      fill: #fff;
    }
    .meta {
      font-size: 15px;
      fill: #475569;
    }
    .field {
      font-size: 15px;
      font-family: Consolas, "Courier New", monospace;
    }
    .foot {
      font-size: 14px;
      fill: #475569;
    }
  </style>
  <rect width="1632" height="1716" fill="#f8fafc" />
  <text x="27" y="48" class="heading">Phản hồi liên tục</text>
  <text x="27" y="82" class="sub">
    10 model chính · 4 model ngữ cảnh · PK / UK / FK lấy từ DMMF thật
  </text>
  <text x="27" y="113" class="sub">
    SVG tổng quan dạng thẻ quan hệ; không phải bản render Mermaid. Xem đầy đủ
    scalar và liên kết ở docs/ERD.md.
  </text>
  <text x="27" y="143" class="sub">
    Xanh dương: miền chính · Xám: ngữ cảnh · Xanh lục: vùng ẩn danh chỉ nối
    Response/Answer.
  </text>
