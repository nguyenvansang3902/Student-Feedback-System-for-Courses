      font-size: 29px;
      font-weight: 700;
    }
    .sub {
      font-size: 17px;
      fill: #475569;
    }
    .model {
      font-size: 22px;
      font-weight: 700;
      fill: #fff;
    }
    .meta {
      font-size: 15px;
      fill: #475569;
    }
    .field {
      font-size: 15px;
      font-family: Consolas, "Courier New", monospace;
    }
    .foot {
      font-size: 14px;
      fill: #475569;
    }
  </style>
