>
  <title id="title">ERD tổng quan: Nền người dùng và danh mục</title>
  <desc id="description">
    10 model chính và 0 model ngữ cảnh. Thẻ liệt kê khóa chính, khóa duy nhất và
    khóa ngoại từ DMMF. SVG được sinh trực tiếp, không render Mermaid. Tuần 9:
    46 model thiết kế, 34 runtime, 12 model chỉ thiết kế. AggregateResult dùng
    cho tổng hợp/công bố theo ngưỡng; 4 bảng phản hồi còn chỉ seed. Chi tiết
    toàn bộ scalar nằm trong ERD.md.
  </desc>
