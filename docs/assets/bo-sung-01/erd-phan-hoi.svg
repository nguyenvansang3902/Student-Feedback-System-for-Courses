  <title id="title">ERD tổng quan: Phản hồi liên tục</title>
  <desc id="description">
    10 model chính và 4 model ngữ cảnh. Thẻ liệt kê khóa chính, khóa duy nhất và
    khóa ngoại từ DMMF. SVG được sinh trực tiếp, không render Mermaid. Điều
    chỉnh số 01: 46 model thiết kế, 31 runtime, 15 model chỉ thiết kế; G1 có 10
    vai trò và cờ nhóm kiểm tra, đánh giá. Chưa có workflow các tuần sau. Chi
    tiết toàn bộ scalar nằm trong ERD.md.
  </desc>
