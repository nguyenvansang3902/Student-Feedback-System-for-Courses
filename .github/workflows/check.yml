name: Kiểm tra chất lượng

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: ci_root_only
          MYSQL_DATABASE: survey_feedback_test
          MYSQL_USER: survey_ci
          MYSQL_PASSWORD: ci_local_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: mysql://survey_ci:ci_local_only@127.0.0.1:3306/survey_feedback_test

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v7
      - name: Cài Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Cài thư viện từ lockfile
        run: npm ci
      - name: Chạy lint, typecheck và test
        run: npm run check
