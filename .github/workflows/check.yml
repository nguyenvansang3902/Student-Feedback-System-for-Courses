name: Kiểm tra chất lượng

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v7
      - name: Cài Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Cài thư viện từ lockfile
        run: npm ci
      - name: Dùng cấu hình giả và khởi động dịch vụ
        run: |
          cp .env.example .env
          npm run auth:key
          docker compose up -d --wait --wait-timeout 180 db mailpit
      - name: Chuẩn bị database shadow riêng
        run: npm run db:prepare
      - name: Áp dụng migration đã duyệt và kiểm tra đồng bộ schema
        run: |
          npm run db:deploy
          npx prisma migrate status
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Kiểm tra ràng buộc trên MySQL thật
        run: npm run test:integration
      - name: Kiểm tra xác thực qua HTTP, MySQL và Mailpit
        run: npm run test:auth
      - name: Kiểm tra TOTP, phân quyền và CLI trên database thử riêng
        run: npm run test:week4
      - name: Kiểm tra danh mục, khóa sổ, CSV/XLSX và kích hoạt qua HTTP
        run: npm run test:week5
      - name: Kiểm tra mẫu phiếu, phiên bản, khóa và preview không ghi dữ liệu
        run: npm run test:week6
      - name: Kiểm tra đợt, readiness, lịch mở đóng và cấu hình ngưỡng qua HTTP
        run: npm run test:week7 && npm run test:week7:settings
      - name: Kiểm tra nộp ẩn danh, 20 request đồng thời và rollback trên MySQL
        run: npm run test:week8
      - name: Kiểm tra tổng hợp, kiểm duyệt, công bố và quyền xem kết quả
        run: npm run test:week9
      - name: Kiểm tra phản hồi, tệp riêng tư và tiếp nhận Thanh tra
        run: npm run test:week10
      - name: Kiểm tra SLA, giải trình, Thanh tra và thông báo Tuần 11
        run: npm run test:week11
      - name: Chuẩn bị bộ đọc PDF thử nghiệm
        run: |
          python3 -m venv "$RUNNER_TEMP/pdf-tests"
          "$RUNNER_TEMP/pdf-tests/bin/python" -m pip install -r scripts/pdf-test-requirements.txt
          echo "PDF_TEST_PYTHON=$RUNNER_TEMP/pdf-tests/bin/python" >> "$GITHUB_ENV"
      - name: Kiểm tra dashboard, chỉ số bất thường và tệp xuất Tuần 12
        run: npm run test:week12
      - name: Kiểm tra khóa chia sẻ, quyền hiện tại và rollback nộp phiếu Tuần 13
        run: npm run test:survey-locks
      - name: Kiểm tra seed và demo trong database mới riêng
        run: npm run test:demo
      - name: Kiểm tra chuyển TOTP từ 30 sang 60 giây trên database thử riêng
        run: npm run test:totp60
      - name: Chạy lint, typecheck, test và ngưỡng độ phủ service
        run: npm run check
      - name: Build ứng dụng
        run: npm run build
      - name: Dừng dịch vụ thử, giữ volume
        if: always()
        run: |
          if [ -f .env ]; then docker compose down; fi

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v7
      - name: Cài Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Cài thư viện từ lockfile
        run: npm ci
      - name: Dùng cấu hình giả cho môi trường thử
        run: |
          cp .env.example .env
          npm run auth:key
      - name: Khởi động MySQL và Mailpit
        run: docker compose up -d --wait --wait-timeout 180 db mailpit
      - name: Kiểm tra trang trên máy chủ dev
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 300s npm run dev > "$RUNNER_TEMP/next-dev.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:3000/api/health > /dev/null 2>&1; then
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              tail -n 80 "$RUNNER_TEMP/next-dev.log"
              exit 1
            fi
            sleep 2
          done

          curl -fsS --max-time 30 http://127.0.0.1:3000/ > "$RUNNER_TEMP/home.html"
          grep -Fq 'Khảo sát và phản hồi về môn học' "$RUNNER_TEMP/home.html"
          curl -fsS --max-time 30 http://127.0.0.1:3000/suc-khoe > "$RUNNER_TEMP/health-page.html"
          grep -Fq 'Ứng dụng đang phản hồi' "$RUNNER_TEMP/health-page.html"
          curl -fsS --max-time 30 http://127.0.0.1:3000/api/health > "$RUNNER_TEMP/health.json"
          node -e 'const data = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); if (data.status !== "ok" || data.application !== "available" || data.database !== "not_checked") process.exit(1)' "$RUNNER_TEMP/health.json"
      - name: Dừng dịch vụ thử
        if: always()
        run: |
          if [ -f .env ]; then docker compose down; fi

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v7
      - name: Cài Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Cài thư viện từ lockfile
        run: npm ci
      - name: Cài Chromium cho Playwright
        run: npx playwright install --with-deps chromium
      - name: Chuẩn bị cấu hình và dịch vụ thử
        run: |
          cp .env.example .env
          npm run auth:key
          docker compose up -d --wait --wait-timeout 180 db mailpit
          npm run db:prepare
          npm run db:deploy
      - name: Chạy UC-GOLD trên database riêng
        run: npm run test:e2e
      - name: Lưu ảnh kiểm tra giao diện giả
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: week13-ui-evidence
          path: |
            test-results/**/*.png
            test-results/**/*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Dừng dịch vụ thử
        if: always()
        run: |
          if [ -f .env ]; then docker compose down; fi
